<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vela — Партнёрский кабинет</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#161826;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:440px;width:100%}
.logo{text-align:center;font-weight:300;letter-spacing:0.18em;text-transform:uppercase;font-size:20px;margin-bottom:8px}
.subtitle{text-align:center;color:#9a9db8;font-size:14px;margin-bottom:32px}
.card{background:#1e2032;border:1px solid #2a2d42;border-radius:16px;padding:32px}
.tabs{display:flex;background:#161826;border-radius:10px;padding:4px;margin-bottom:28px}
.tab{flex:1;padding:10px;border-radius:7px;border:none;background:none;color:#9a9db8;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.tab.active{background:#1e2032;color:#fff}
.form{display:none}
.form.active{display:block}
.fg{margin-bottom:18px}
.fl{display:block;font-size:12px;font-weight:600;color:#9a9db8;margin-bottom:7px;text-transform:uppercase;letter-spacing:0.5px}
.fi{width:100%;background:#262940;border:1px solid #333650;border-radius:8px;padding:11px 14px;color:#f0f0f0;font-size:14px;font-family:'Inter',sans-serif;outline:none}
.fi:focus{border-color:#2fbf80}
.fi::placeholder{color:#6b6e8a}
.btn{width:100%;background:#2fbf80;color:#fff;border:none;padding:13px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px}
.btn:hover{background:#26a06c}
.btn:disabled{opacity:.6;cursor:not-allowed}
.hint{font-size:11px;color:#6b6e8a;margin-top:6px;line-height:1.5}
.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;line-height:1.5}
.alert.error{background:rgba(230,85,85,.1);border:1px solid rgba(230,85,85,.2);color:#e55}
.alert.success{background:rgba(47,191,128,.1);border:1px solid rgba(47,191,128,.2);color:#2fbf80}
.back-link{display:block;text-align:center;margin-top:20px;color:#6b6e8a;font-size:13px;text-decoration:none}
.back-link:hover{color:#9a9db8}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Vela</div>
  <div class="subtitle">Партнёрский кабинет</div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Вход</button>
      <button class="tab" onclick="switchTab('register')">Регистрация</button>
    </div>
    <div id="alert-box"></div>

    <div class="form active" id="form-login">
      <div class="fg">
        <label class="fl">Email</label>
        <input class="fi" type="email" id="login-email" placeholder="you@example.ru"/>
      </div>
      <div class="fg">
        <label class="fl">Пароль</label>
        <input class="fi" type="password" id="login-password" placeholder="••••••••"/>
      </div>
      <button class="btn" onclick="doLogin()" id="login-btn">Войти в кабинет</button>
    </div>

    <div class="form" id="form-register">
      <div class="fg">
        <label class="fl">Имя</label>
        <input class="fi" type="text" id="reg-name" placeholder="Как к вам обращаться"/>
      </div>
      <div class="fg">
        <label class="fl">Email</label>
        <input class="fi" type="email" id="reg-email" placeholder="you@example.ru"/>
      </div>
      <div class="fg">
        <label class="fl">Пароль</label>
        <input class="fi" type="password" id="reg-password" placeholder="Минимум 8 символов"/>
        <div class="hint">Минимум 8 символов</div>
      </div>
      <button class="btn" onclick="doRegister()" id="reg-btn">Создать аккаунт партнёра</button>
    </div>
  </div>
  <a href="https://velaapp.ru" class="back-link">← Вернуться на сайт Vela</a>
</div>
<script>
const API = 'https://api.gptcash.ru';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  document.getElementById('alert-box').innerHTML = '';
  event.target.classList.add('active');
  document.getElementById('form-' + tab).classList.add('active');
}

function showAlert(msg, type) {
  document.getElementById('alert-box').innerHTML = '<div class="alert ' + type + '">' + msg + '</div>';
}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showAlert('Заполните email и пароль', 'error');

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Входим...';

  try {
    const res = await fetch(API + '/partner/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');

    localStorage.setItem('vela_partner_session', data.sessionToken);
    localStorage.setItem('vela_partner_id', data.partnerId);
    showAlert('Успешный вход! Переход в кабинет...', 'success');
    setTimeout(() => window.location.href = 'partner-dashboard.html', 600);
  } catch(e) {
    showAlert(e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Войти в кабинет';
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  if (!email) return showAlert('Введите email', 'error');
  if (!password || password.length < 8) return showAlert('Пароль должен быть не менее 8 символов', 'error');

  const btn = document.getElementById('reg-btn');
  btn.disabled = true;
  btn.textContent = 'Создаём...';

  try {
    const res = await fetch(API + '/partner/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password, name, type: 'BLOGGER' })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');

    localStorage.setItem('vela_partner_session', data.sessionToken);
    localStorage.setItem('vela_partner_id', data.partnerId);
    showAlert('Аккаунт создан! Переход в кабинет...', 'success');
    setTimeout(() => window.location.href = 'partner-dashboard.html', 600);
  } catch(e) {
    showAlert(e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Создать аккаунт партнёра';
  }
}
</script>
</body>
</html>
