<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vela — Вход в партнёрский кабинет</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#161826;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:440px;width:100%;text-align:center}
.card{background:#1e2032;border:1px solid #2a2d42;border-radius:16px;padding:40px 32px}
.icon{font-size:40px;margin-bottom:16px}
h2{font-size:18px;font-weight:800;margin-bottom:10px}
p{color:#9a9db8;font-size:13px;line-height:1.6}
.btn{display:inline-block;background:#2fbf80;color:#fff;border:none;padding:13px 28px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:16px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="content">
    <div class="icon">⏳</div>
    <h2>Проверяем ссылку...</h2>
    <p>Одну секунду</p>
  </div>
</div>
<script>
const API = 'https://api.gptcash.ru';

async function verify() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const content = document.getElementById('content');

  if (!token) {
    content.innerHTML = '<div class="icon">⚠️</div><h2>Ссылка некорректна</h2><p>Токен не найден. Запросите новую ссылку для входа.</p><a class="btn" href="partner-login.html">Войти заново</a>';
    return;
  }

  try {
    const res = await fetch(API + '/partner/verify?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');

    localStorage.setItem('vela_partner_session', data.sessionToken);
    localStorage.setItem('vela_partner_id', data.partnerId);

    content.innerHTML = '<div class="icon">✅</div><h2>Вход выполнен</h2><p>Переходим в кабинет...</p>';
    setTimeout(() => { window.location.href = 'partner-dashboard.html'; }, 800);
  } catch(e) {
    content.innerHTML = '<div class="icon">⚠️</div><h2>Ссылка недействительна</h2><p>Ссылка устарела или уже была использована. Запросите новую.</p><a class="btn" href="partner-login.html">Войти заново</a>';
  }
}
verify();
</script>
</body>
</html>
