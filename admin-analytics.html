<style>

<body>

      <button class="preset-btn" onclick="applyPreset(this,'month')">ÐœÐµÑÑÑ†</button>
      <button class="preset-btn" onclick="applyPreset(this,'lastmonth')">ÐŸÑ€Ð¾ÑˆÐ»Ñ‹Ð¹ Ð¼ÐµÑÑÑ†</button>
      <button class="preset-btn" onclick="applyPreset(this,'3months')">3 Ð¼ÐµÑÑÑ†Ð°</button>
      <button class="preset-btn" onclick="applyPreset(this,'year')">Ð“Ð¾Ð´</button>
      <button class="preset-btn" onclick="applyPreset(this,'all')">Ð—Ð° Ð²ÑÑ‘ Ð²Ñ€ÐµÐ¼Ñ</button>
      <input type="date" id="date-from"/>
      <span style="color:#6b6e8a">â€”</span>

    <button class="tab-btn" onclick="switchTab('finance',this)">Ð¤Ð¸Ð½Ð°Ð½ÑÑ‹</button>

  <div id="content"><div class="loading">Ð—Ð°Ð³Ñ€ÑƒÐ·ÐºÐ°...</div></div>
</div>

<script>
const API = 'https://romptcash-backend.onrender.com';
const SECRET = 'promptcash_admin_2024';
const charts = {};
let currentTab = 'product';
let lastData = null;

function fmtMoney(n) {
  return Math.round(n).toLocaleString('ru') + ' â‚½';
}

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}

function computePresetDates(preset) {
  const today = new Date();
  let from = new Date(today), to = new Date(today);
  if (preset === 'today') { /* from=to=today */ }
  else if (preset === 'yesterday') { from.setDate(from.getDate()-1); to.setDate(to.getDate()-1); }
  else if (preset === 'week') { from.setDate(from.getDate()-6); }
  else if (preset === 'month') { from.setDate(from.getDate()-29); }
  else if (preset === 'lastmonth') {
    to = new Date(today.getFullYear(), today.getMonth(), 0);
    from = new Date(today.getFullYear(), today.getMonth()-1, 1);
  }
  else if (preset === '3months') { from.setDate(from.getDate()-89); }
  else if (preset === 'year') { from.setDate(from.getDate()-364); }
  else if (preset === 'all') { from = new Date('2025-01-01'); }
  return { from: fmtDate(from), to: fmtDate(to) };
}

function applyPreset(btn, preset) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const d = computePresetDates(preset);
  document.getElementById('date-from').value = d.from;
  document.getElementById('date-to').value = d.to;
  loadAll();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderContent();
}

function buildChart(canvasId, labels, data, color, label) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label,
        data,
        borderColor: color,
        backgroundColor: color + '22',
        fill: true,
        tension: 0.3,
        pointRadius: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { enabled: true, mode: 'index', intersect: false } },
      scales: {
        x: { ticks: { color: '#6b6e8a', maxTicksLimit: 10 }, grid: { color: '#1e2032' } },
        y: { ticks: { color: '#6b6e8a' }, grid: { color: '#2a2d42' }, beginAtZero: true }
      }
    }
  });
}

function statRowHtml(field, s, isMoney) {
  const fmt = v => isMoney ? fmtMoney(v) : (v||0).toLocaleString('ru');
  return `<div class="stat-row">
    <div class="stat-box"><div class="lbl">Ð¡ÐµÐ³Ð¾Ð´Ð½Ñ</div><div class="val">${fmt(s.today[field])}</div></div>
    <div class="stat-box"><div class="lbl">Ð—Ð° Ð½ÐµÐ´ÐµÐ»ÑŽ</div><div class="val">${fmt(s.week[field])}</div></div>
    <div class="stat-box"><div class="lbl">Ð—Ð° Ð¼ÐµÑÑÑ†</div><div class="val">${fmt(s.month[field])}</div></div>
  </div>`;
}

function renderContent() {
  if (!lastData) return;
  if (currentTab === 'product') renderProduct(lastData);
  else renderFinance(lastData);
}

function renderProduct(data) {
  const s = data.summary;
  const m = data.money;
  const c = data.campaigns;
  const series = data.series;
  const contentEl = document.getElementById('content');

  contentEl.innerHTML =
    '<div class="section-title">Ð£ÑÑ‚Ð°Ð½Ð¾Ð²ÐºÐ¸ Ñ€Ð°ÑÑˆÐ¸Ñ€ÐµÐ½Ð¸Ñ</div>' +
    statRowHtml('installs', s) +
    '<div class="chart-card"><canvas id="chart-installs"></canvas></div>' +

    '<div class="section-title">ÐŸÐ¾ÐºÐ°Ð·Ñ‹ Ñ€ÐµÐºÐ»Ð°Ð¼Ñ‹</div>' +
    statRowHtml('impressions', s) +
    '<div class="chart-card"><canvas id="chart-impressions"></canvas></div>' +

    '<div class="section-title">ÐšÐ»Ð¸ÐºÐ¸ Ð¿Ð¾ Ð¾Ð±ÑŠÑÐ²Ð»ÐµÐ½Ð¸ÑÐ¼</div>' +
    statRowHtml('clicks', s) +
    '<div class="chart-card"><canvas id="chart-clicks"></canvas></div>' +

    '<div class="section-title">ÐÐºÑ‚Ð¸Ð²Ð½Ñ‹Ðµ Ð¿Ð¾Ð»ÑŒÐ·Ð¾Ð²Ð°Ñ‚ÐµÐ»Ð¸</div>' +
    statRowHtml('activeUsers', s) +
    '<div class="chart-card"><canvas id="chart-activeUsers"></canvas></div>' +

    '<div class="section-title">Ð ÐµÐºÐ»Ð°Ð¼Ð½Ñ‹Ðµ ÐºÐ°Ð¼Ð¿Ð°Ð½Ð¸Ð¸</div>' +
    '<div class="camp-row">' +
      '<div class="camp-box"><div class="lbl">Ð’ÑÐµÐ³Ð¾</div><div class="val">' + c.total + '</div></div>' +
      '<div class="camp-box"><div class="lbl">ÐÐºÑ‚Ð¸Ð²Ð½Ñ‹Ðµ</div><div class="val">' + c.active + '</div></div>' +
      '<div class="camp-box"><div class="lbl">ÐÐµÐ°ÐºÑ‚Ð¸Ð²Ð½Ñ‹Ðµ</div><div class="val">' + c.inactive + '</div></div>' +
      '<div class="camp-box"><div class="lbl">ÐžÑ‚ÐºÐ»Ð¾Ð½Ñ‘Ð½Ð½Ñ‹Ðµ</div><div class="val">' + c.rejected + '</div></div>' +
    '</div>' +
    '<div class="stat-row">' +
      '<div class="stat-box"><div class="lbl">Ð—Ð°Ð¿ÑƒÑ‰ÐµÐ½Ð¾ ÑÐµÐ³Ð¾Ð´Ð½Ñ</div><div class="val">' + c.today + '</div></div>' +
      '<div class="stat-box"><div class="lbl">Ð—Ð° Ð½ÐµÐ´ÐµÐ»ÑŽ</div><div class="val">' + c.week + '</div></div>' +
      '<div class="stat-box"><div class="lbl">Ð—Ð° Ð¼ÐµÑÑÑ†</div><div class="val">' + c.month + '</div></div>' +
    '</div>' +
    '<div class="chart-card"><canvas id="chart-campaignsLaunched"></canvas></div>';

  const labels = series.map(d => d.date.slice(5));
  buildChart('chart-installs', labels, series.map(d => d.installs), '#2fbf80', 'Ð£ÑÑ‚Ð°Ð½Ð¾Ð²ÐºÐ¸');
  buildChart('chart-impressions', labels, series.map(d => d.impressions), '#5b9eff', 'ÐŸÐ¾ÐºÐ°Ð·Ñ‹');
  buildChart('chart-clicks', labels, series.map(d => d.clicks), '#f5a623', 'ÐšÐ»Ð¸ÐºÐ¸');
  buildChart('chart-activeUsers', labels, series.map(d => d.activeUsers), '#a685e2', 'ÐÐºÑ‚Ð¸Ð²Ð½Ñ‹Ðµ ÑŽÐ·ÐµÑ€Ñ‹');
  buildChart('chart-campaignsLaunched', labels, series.map(d => d.campaignsLaunched), '#e55', 'ÐšÐ°Ð¼Ð¿Ð°Ð½Ð¸Ð¸');
}

function renderFinance(data) {
  const s = data.summary;
  const m = data.money;
  const series = data.series;
  const contentEl = document.getElementById('content');

  contentEl.innerHTML =
    '<div class="section-title">Ð’Ñ‹Ñ€ÑƒÑ‡ÐºÐ° (Ñ€Ð°ÑÑ…Ð¾Ð´Ñ‹ Ñ€ÐµÐºÐ»Ð°Ð¼Ð¾Ð´Ð°Ñ‚ÐµÐ»ÐµÐ¹ Ð½Ð° Ð¿Ð¾ÐºÐ°Ð·Ñ‹)</div>' +
    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">Ð¡ÐµÐ³Ð¾Ð´Ð½Ñ</div><div class="val" style="color:#2fbf80">' + fmtMoney(s.today.revenueRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Ð—Ð° Ð½ÐµÐ´ÐµÐ»ÑŽ</div><div class="val" style="color:#2fbf80">' + fmtMoney(s.week.revenueRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Ð—Ð° Ð¼ÐµÑÑÑ†</div><div class="val" style="color:#2fbf80">' + fmtMoney(s.month.revenueRub) + '</div></div>' +
    '</div>' +
    '<div class="chart-card"><canvas id="chart-revenueRub"></canvas></div>' +

    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">ÐÐ°Ñ‡Ð¸ÑÐ»ÐµÐ½Ð¾ Ð²ÑÐµÐ³Ð¾</div><div class="val" style="color:#a685e2">' + fmtMoney(m.accruedRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Ð”Ð¾ÑÑ‚ÑƒÐ¿Ð½Ð¾ Ðº Ð²Ñ‹Ð²Ð¾Ð´Ñƒ</div><div class="val" style="color:#f5a623">' + fmtMoney(m.availableRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Ð’Ñ‹Ð¿Ð»Ð°Ñ‡ÐµÐ½Ð¾</div><div class="val" style="color:#5b9eff">' + fmtMoney(m.paidRub) + '</div></div>' +
    '</div>' +
    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">Ð˜Ð· Ð¿Ð¾ÐºÐ°Ð·Ð¾Ð²</div><div class="val">' + fmtMoney(m.walletOnlyRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Ð‘Ð¾Ð½ÑƒÑÑ‹ Ð·Ð° Ð¾Ð½Ð±Ð¾Ñ€Ð´Ð¸Ð½Ð³</div><div class="val">' + fmtMoney(m.bonusesOnlyRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Ð ÐµÑ„ÐµÑ€Ð°Ð»ÑŒÐ½Ñ‹Ðµ</div><div class="val">' + fmtMoney(m.referralOnlyRub) + '</div></div>' +

  const labels = series.map(d => d.date.slice(5));
  buildChart('chart-revenueRub', labels, series.map(d => d.revenueRub), '#2fbf80', 'Ð’Ñ‹Ñ€ÑƒÑ‡ÐºÐ°, â‚½');
}

async function loadAll() {
  const fromVal = document.getElementById('date-from').value;
  const toVal = document.getElementById('date-to').value;
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '<div class="loading">Ð—Ð°Ð³Ñ€ÑƒÐ·ÐºÐ°...</div>';

  let url = API + '/admin/analytics?';
  if (fromVal && toVal) {
    url += 'from=' + fromVal + '&to=' + toVal;
  } else {
    url += 'days=30';
  }

  try {
    const res = await fetch(url, { headers: { 'x-admin-secret': SECRET } });
    const data = await res.json();
    lastData = data;
    renderContent();
  } catch(e) {
    contentEl.innerHTML = '<div class="loading">ÐžÑˆÐ¸Ð±ÐºÐ° Ð·Ð°Ð³Ñ€ÑƒÐ·ÐºÐ¸: ' + e.message + '</div>';
  }
}

// ÐÐ²Ñ‚Ð¾Ð·Ð°Ð¿ÑƒÑÐº
applyPreset(document.querySelector('.preset-btn.active'), 'week');
</script>
