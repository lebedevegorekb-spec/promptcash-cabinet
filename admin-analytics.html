<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vela — Аналитика</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#161826;color:#f0f0f0;font-size:14px;line-height:1.6;padding:32px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.logo{font-weight:300;letter-spacing:0.18em;text-transform:uppercase;font-size:18px}
.period-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.period-box input[type=date]{background:#262940;border:1px solid #333650;border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;font-family:'Inter',sans-serif}
.preset-btn{background:#262940;border:1px solid #333650;border-radius:8px;padding:8px 12px;color:#9a9db8;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.preset-btn:hover{border-color:#2fbf80;color:#fff}
.preset-btn.active{background:#2fbf80;border-color:#2fbf80;color:#fff;font-weight:600}
.btn{background:#2fbf80;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{background:#26a06c}
.gate{max-width:400px;margin:120px auto;text-align:center}
.gate input{width:100%;background:#262940;border:1px solid #333650;border-radius:8px;padding:11px 14px;color:#fff;font-size:14px;margin-bottom:12px;font-family:'Inter',sans-serif}
.section-title{font-size:16px;font-weight:700;margin:32px 0 14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.stat-box{background:#1e2032;border:1px solid #2a2d42;border-radius:12px;padding:18px}
.stat-box .lbl{font-size:11px;color:#9a9db8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.stat-box .val{font-size:26px;font-weight:800;color:#2fbf80}
.money-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.money-box{background:#1e2032;border:1px solid #2a2d42;border-radius:12px;padding:18px;text-align:center}
.money-box .lbl{font-size:11px;color:#9a9db8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.money-box .val{font-size:22px;font-weight:800}
.camp-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.camp-box{background:#1e2032;border:1px solid #2a2d42;border-radius:12px;padding:16px;text-align:center}
.camp-box .lbl{font-size:11px;color:#9a9db8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.camp-box .val{font-size:22px;font-weight:800;color:#2fbf80}
.chart-card{background:#1e2032;border:1px solid #2a2d42;border-radius:14px;padding:20px;margin-bottom:20px;height:260px}
.loading{text-align:center;color:#9a9db8;padding:40px}
.tabs{display:flex;gap:4px;margin-bottom:24px;background:#1e2032;border-radius:10px;padding:4px;width:fit-content}.tab-btn{padding:8px 20px;border-radius:7px;border:none;background:none;color:#9a9db8;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;transition:all .15s}.tab-btn.active{background:#2fbf80;color:#fff}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="logo" style="margin-bottom:24px">Vela — Аналитика</div>
  <input type="password" id="secret-input" placeholder="Admin secret"/>
  <button class="btn" style="width:100%" onclick="doLogin()">Войти</button>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <div class="logo">Vela — Аналитика</div>
    <div class="period-box">
      <button class="preset-btn active" data-preset="week" onclick="applyPreset(this,'week')">Неделя</button>
      <button class="preset-btn" data-preset="today" onclick="applyPreset(this,'today')">Сегодня</button>
      <button class="preset-btn" data-preset="yesterday" onclick="applyPreset(this,'yesterday')">Вчера</button>
      <button class="preset-btn" data-preset="month" onclick="applyPreset(this,'month')">Месяц</button>
      <button class="preset-btn" data-preset="lastmonth" onclick="applyPreset(this,'lastmonth')">Прошлый месяц</button>
      <button class="preset-btn" data-preset="3months" onclick="applyPreset(this,'3months')">3 месяца</button>
      <button class="preset-btn" data-preset="year" onclick="applyPreset(this,'year')">Год</button>
      <button class="preset-btn" data-preset="all" onclick="applyPreset(this,'all')">За всё время</button>
      <input type="date" id="date-from"/>
      <span style="color:#6b6e8a">—</span>
      <input type="date" id="date-to"/>
      <button class="btn" onclick="loadAll()">Применить</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('product',this)">Продукт</button>
    <button class="tab-btn" onclick="switchTab('finance',this)">Финансы</button>
  </div>
  <div id="content"><div class="loading">Загрузка...</div></div>
</div>

<script>
const API = 'https://romptcash-backend.onrender.com';
let SECRET = sessionStorage.getItem('pc_admin_secret');

if (SECRET) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  applyPreset(document.querySelector('[data-preset="week"]'), 'week');
}
function doLogin() {
  const val = document.getElementById('secret-input').value;
  if (!val) return;
  sessionStorage.setItem('pc_admin_secret', val);
  SECRET = val;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  applyPreset(document.querySelector('[data-preset="week"]'), 'week');
}
const charts = {};
let currentTab = 'product';
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderContent();
}
let lastData = null;

function fmtMoney(n) {
  return Math.round(n).toLocaleString('ru') + ' ₽';
}

function buildChart(canvasId, labels, data, color, label) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: label,
        data: data,
        borderColor: color,
        backgroundColor: color + '22',
        fill: true,
        tension: 0.3,
        pointRadius: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e2032',
          borderColor: '#2a2d42',
          borderWidth: 1,
          titleColor: '#fff',
          bodyColor: '#2fbf80',
          padding: 10,
          displayColors: false,
          callbacks: { label: (ctx) => label + ': ' + ctx.parsed.y.toLocaleString('ru') }
        }
      },
      scales: {
        x: { ticks: { color: '#6b6e8a', maxTicksLimit: 8 }, grid: { color: '#2a2d42' } },
        y: { ticks: { color: '#6b6e8a' }, grid: { color: '#2a2d42' }, beginAtZero: true }
      }
    }
  });
}

function fmtDate(d) { return d.toISOString().slice(0, 10); }

function computePresetDates(preset) {
  const today = new Date();
  let from = new Date(today), to = new Date(today);
  if (preset === 'yesterday') { from.setDate(from.getDate() - 1); to.setDate(to.getDate() - 1); }
  else if (preset === 'week') { from.setDate(from.getDate() - 6); }
  else if (preset === 'month') { from.setDate(from.getDate() - 29); }
  else if (preset === 'lastmonth') {
    to = new Date(today.getFullYear(), today.getMonth(), 0);
    from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  }
  else if (preset === '3months') { from.setDate(from.getDate() - 89); }
  else if (preset === 'year') { from.setDate(from.getDate() - 364); }
  else if (preset === 'all') { from = new Date('2025-01-01'); }
  return { from: fmtDate(from), to: fmtDate(to) };
}

function applyPreset(btn, preset) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const d = computePresetDates(preset);
  document.getElementById('date-from').value = d.from;
  document.getElementById('date-to').value = d.to;
  loadAll();
}

async function loadAll() {
  const fromVal = document.getElementById('date-from').value;
  const toVal = document.getElementById('date-to').value;
  const contentEl = document.getElementById('content');

  let url = API + '/admin/analytics?';
  if (fromVal && toVal) {
    url += 'from=' + fromVal + '&to=' + toVal;
  } else {
    url += 'days=30';
  }

  try {
    const res = await fetch(url, {
      headers: { 'x-admin-secret': SECRET }
    });
    if (res.status === 401) {
      sessionStorage.removeItem('pc_admin_secret');
      alert('Неверный admin secret');
      location.reload();
      return;
    }
    const data = await res.json();
    render(data);
  } catch(e) {
    contentEl.innerHTML = '<div class="loading">Ошибка загрузки: ' + e.message + '</div>';
  }
}

function statRowHtml(field, s, isMoney) {
  const t = isMoney ? fmtMoney(s.today[field]) : s.today[field].toLocaleString('ru');
  const w = isMoney ? fmtMoney(s.week[field]) : s.week[field].toLocaleString('ru');
  const mo = isMoney ? fmtMoney(s.month[field]) : s.month[field].toLocaleString('ru');
  return `<div class="stat-row">    <div class="stat-box"><div class="lbl">Сегодня</div><div class="val">${t}</div></div>    <div class="stat-box"><div class="lbl">За неделю</div><div class="val">${w}</div></div>    <div class="stat-box"><div class="lbl">За месяц</div><div class="val">${mo}</div></div>  </div>`;
}

function renderContent() {
  if (!lastData) return;
  if (currentTab === 'product') renderProduct(lastData);
  else renderFinance(lastData);
}
function renderFinance(data) {
  const m = data.money;
  const s = data.summary;
  const contentEl = document.getElementById('content');
  contentEl.innerHTML =
    '<div class="section-title">Выручка (расходы рекламодателей на показы)</div>' +
    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">Сегодня</div><div class="val" style="color:#2fbf80">' + Math.round(s.today.revenueRub).toLocaleString('ru') + ' ₽</div></div>' +
      '<div class="money-box"><div class="lbl">За неделю</div><div class="val" style="color:#2fbf80">' + Math.round(s.week.revenueRub).toLocaleString('ru') + ' ₽</div></div>' +
      '<div class="money-box"><div class="lbl">За месяц</div><div class="val" style="color:#2fbf80">' + Math.round(s.month.revenueRub).toLocaleString('ru') + ' ₽</div></div>' +
    '</div>' +
    '<div class="section-title">Выплаты пользователям</div>' +
    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">Начислено всего юзерам</div><div class="val" style="color:#a685e2">' + Math.round(m.accruedRub).toLocaleString('ru') + ' ₽</div></div>' +
      '<div class="money-box"><div class="lbl">Доступно к выводу</div><div class="val" style="color:#f5a623">' + Math.round(m.availableRub).toLocaleString('ru') + ' ₽</div></div>' +
      '<div class="money-box"><div class="lbl">Выплачено</div><div class="val" style="color:#5b9eff">' + Math.round(m.paidRub).toLocaleString('ru') + ' ₽</div></div>' +
    '</div>' +
    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">Из кошельков (без бонусов)</div><div class="val">' + Math.round(m.walletOnlyRub).toLocaleString('ru') + ' ₽</div></div>' +
      '<div class="money-box"><div class="lbl">Бонусы за онбординг</div><div class="val">' + Math.round(m.bonusesOnlyRub).toLocaleString('ru') + ' ₽</div></div>' +
      '<div class="money-box"><div class="lbl">Реферальные</div><div class="val">' + Math.round(m.referralOnlyRub).toLocaleString('ru') + ' ₽</div></div>' +
    '</div>';
}
  const s = data.summary;
  const m = data.money;
  const c = data.campaigns;
  const series = data.series;

  const contentEl = document.getElementById('content');
  contentEl.innerHTML =
    '<div class="section-title">Установки расширения</div>' +
    statRowHtml('installs', s) +
    '<div class="chart-card"><canvas id="chart-installs"></canvas></div>' +

    '<div class="section-title">Показы рекламы</div>' +
    statRowHtml('impressions', s) +
    '<div class="chart-card"><canvas id="chart-impressions"></canvas></div>' +

    '<div class="section-title">Клики по объявлениям</div>' +
    statRowHtml('clicks', s) +
    '<div class="chart-card"><canvas id="chart-clicks"></canvas></div>' +

    '<div class="section-title">Активные пользователи</div>' +
    statRowHtml('activeUsers', s) +
    '<div class="chart-card"><canvas id="chart-activeUsers"></canvas></div>' +

    '<div class="section-title">Выручка (валовая, от рекламодателей)</div>' +
    statRowHtml('revenueRub', s, true) +
    '<div class="money-row">' +
      '<div class="money-box"><div class="lbl">Начислено юзерам всего</div><div class="val" style="color:#2fbf80">' + fmtMoney(m.accruedRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Доступно к выводу</div><div class="val" style="color:#f5a623">' + fmtMoney(m.availableRub) + '</div></div>' +
      '<div class="money-box"><div class="lbl">Выплачено</div><div class="val" style="color:#5b9eff">' + fmtMoney(m.paidRub) + '</div></div>' +
    '</div>' +
    '<div class="chart-card"><canvas id="chart-revenueRub"></canvas></div>' +

    '<div class="section-title">Рекламные кампании</div>' +
    '<div class="camp-row">' +
      '<div class="camp-box"><div class="lbl">Всего</div><div class="val">' + c.total + '</div></div>' +
      '<div class="camp-box"><div class="lbl">Активные</div><div class="val">' + c.active + '</div></div>' +
      '<div class="camp-box"><div class="lbl">Неактивные</div><div class="val">' + c.inactive + '</div></div>' +
      '<div class="camp-box"><div class="lbl">Отклонённые</div><div class="val">' + c.rejected + '</div></div>' +
    '</div>' +
    '<div class="stat-row">' +
      '<div class="stat-box"><div class="lbl">Запущено сегодня</div><div class="val">' + c.today + '</div></div>' +
      '<div class="stat-box"><div class="lbl">За неделю</div><div class="val">' + c.week + '</div></div>' +
      '<div class="stat-box"><div class="lbl">За месяц</div><div class="val">' + c.month + '</div></div>' +
    '</div>' +
    '<div class="chart-card"><canvas id="chart-campaignsLaunched"></canvas></div>';

  const labels = series.map(d => d.date.slice(5));
  buildChart('chart-installs', labels, series.map(d => d.installs), '#2fbf80', 'Установки');
  buildChart('chart-impressions', labels, series.map(d => d.impressions), '#5b9eff', 'Показы');
  buildChart('chart-clicks', labels, series.map(d => d.clicks), '#f5a623', 'Клики');
  buildChart('chart-activeUsers', labels, series.map(d => d.activeUsers), '#a685e2', 'Активные юзеры');
  buildChart('chart-revenueRub', labels, series.map(d => d.revenueRub), '#2fbf80', 'Выручка, ₽');
  buildChart('chart-campaignsLaunched', labels, series.map(d => d.campaignsLaunched), '#e55', 'Кампании');
}
</script>
</body>
</html>
